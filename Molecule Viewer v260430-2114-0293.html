<style>
:root {
  --bg:         #07090f;
  --surface:    #0d1117;
  --surface2:   #111827;
  --border:     #1e2433;
  --border2:    #2a3347;
  --text:       #c8d6f0;
  --muted:      #5a6680;
  --accent:     #4facfe;
  --accent2:    #00d48b;
  --accent3:    #f5c518;
  --danger:     #ff4d6d;

  /* CPK colours */
  --cpk-C:  #8a9bb5;
  --cpk-H:  #e8edf5;
  --cpk-O:  #ff4d4d;
  --cpk-N:  #4facfe;
  --cpk-S:  #f5c518;
  --cpk-P:  #ff8c42;
  --cpk-Fe: #ff8c42;
  --cpk-Mg: #34d399;
  --cpk-Co: #f472b6;
  --cpk-Cl: #34d399;
  --cpk-Na: #a78bfa;
  --cpk-Ca: #60a5fa;

  /* Category colours */
  --cat-organic:        #4facfe;
  --cat-biomolecule:    #34d399;
  --cat-carbon:         #8a9bb5;
  --cat-organometallic: #f5c518;

  --font-head: 'Bebas Neue', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}

/* ── LAYOUT ─────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ── TOPBAR ──────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 44px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}

.topbar-logo {
  font-family: var(--font-head);
  font-size: 18px;
  letter-spacing: 2px;
  color: var(--accent);
  white-space: nowrap;
}

.topbar-logo span {
  display: none; /* hidden on mobile */
}

@media (min-width: 600px) {
  .topbar-logo { font-size: 22px; }
  .topbar-logo span {
    display: inline;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 400;
    letter-spacing: 0;
    margin-left: 8px;
    vertical-align: middle;
  }
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.mode-toggle {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  overflow: hidden;
}

.mode-btn {
  padding: 8px 14px;
  min-height: 36px;
  font-family: var(--font-mono);
  font-size: 10px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.4px;
  white-space: nowrap;
}

.mode-btn.active {
  background: var(--accent);
  color: var(--bg);
}

.mode-btn:hover:not(.active) { color: var(--text); }

.version-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.5px;
  display: none;
}
@media (min-width: 600px) { .version-badge { display: block; } }

/* ── MOLECULE STRIP (top horizontal scroll) ──────────────── */
.mol-strip-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.strip-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 5px;
  border-bottom: 1px solid var(--border);
}

.search-box {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus { border-color: var(--accent); }

.filter-row {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 5px 12px 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }

.filter-btn {
  padding: 3px 9px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.3px;
  white-space: nowrap;
  flex-shrink: 0;
}

.filter-btn:hover { color: var(--text); }
.filter-btn.active-organic        { background: #1a3050; border-color: var(--cat-organic); color: var(--cat-organic); }
.filter-btn.active-biomolecule    { background: #0d2a20; border-color: var(--cat-biomolecule); color: var(--cat-biomolecule); }
.filter-btn.active-carbon         { background: #1a1f2e; border-color: var(--cat-carbon); color: var(--cat-carbon); }
.filter-btn.active-organometallic { background: #2a2000; border-color: var(--cat-organometallic); color: var(--cat-organometallic); }

/* The horizontal molecule card scroll row */
.mol-strip {
  display: flex;
  gap: 6px;
  padding: 7px 12px 9px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.mol-strip::-webkit-scrollbar { display: none; }

.mol-card {
  flex-shrink: 0;
  width: 120px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.mol-card:active { background: var(--surface2); }

.mol-card.active {
  background: var(--surface2);
  border-color: var(--accent);
}

.mol-card-symbol {
  font-family: var(--font-head);
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mol-card.active .mol-card-symbol { color: var(--accent); }

.mol-card-formula {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.mol-card-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

/* Legacy sidebar — hidden */
.sidebar { display: none; }

/* ── MAIN AREA ───────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ── VIEWER ──────────────────────────────────────────────── */
.viewer-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  background: radial-gradient(ellipse at center, #0f1420 0%, var(--bg) 70%);
}

#molCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}
#molCanvas:active { cursor: grabbing; }

.viewer-hud {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.hud-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  background: rgba(13,17,23,0.8);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  letter-spacing: 0.3px;
}

.hud-badge.active-mode { color: var(--accent2); border-color: var(--accent2); }

.hud-reset {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  background: rgba(13,17,23,0.85);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 5px 10px;
  min-height: 30px;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.hud-reset:hover, .hud-reset:active { color: var(--text); border-color: var(--accent); }

.viewer-hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  opacity: 0.6;
  pointer-events: none;
  white-space: nowrap;
}

.no-mol {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
}

.no-mol-icon {
  font-size: 48px;
  opacity: 0.3;
}

.no-mol-text {
  font-family: var(--font-head);
  font-size: 20px;
  letter-spacing: 2px;

}

/* ── DETAIL PANEL ────────────────────────────────────────── */
.detail-panel {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 14px 12px;
  flex-shrink: 0;
  overflow-y: auto;
  max-height: 38vh;
  -webkit-overflow-scrolling: touch;
}

.detail-inner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.detail-left { flex: 1; min-width: 0; }

.detail-name {
  font-family: var(--font-head);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 1px;
}

.detail-formula {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 6px;
}

.detail-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.detail-meta {
  display: flex;
  gap: 14px;
  margin-top: 7px;
  flex-wrap: wrap;
}

.detail-kv {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.detail-k {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--muted);
  text-transform: uppercase;

}

.detail-v {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
}

.detail-right {
  flex-shrink: 0;
}

.atom-counts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;

}

.atom-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: var(--font-mono);
  font-size: 10px;
}

.atom-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── EMPTY PANEL ─────────────────────────────────────────── */
.empty-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-family: var(--font-head);
  font-size: 16px;
  letter-spacing: 2px;
  opacity: 0.4;
  grid-column: 1/-1;
}

/* ── ATOM TOOLTIP ────────────────────────────────────────── */
.atom-tooltip {
  position: absolute;
  background: rgba(13,17,23,0.95);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 10px;
  pointer-events: none;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
  line-height: 1.5;
  white-space: nowrap;
  display: none;
  z-index: 20;
  backdrop-filter: blur(4px);
}
.atom-tooltip.visible { display: block; }
.hidden { display: none !important; }

/* ── ROTATION INDICATOR ──────────────────────────────────── */
.rot-ring {
  position: absolute;
  bottom: 24px;
  right: 18px;
  width: 32px;
  height: 32px;
  border: 2px solid var(--border2);
  border-radius: 50%;
  opacity: 0.4;
  pointer-events: none;
}

/* ── MOBILE LIST (hidden by default) ────────────────────── */
.mobile-list {
  display: none;
  padding: 0 16px 80px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

.mob-cat-section { margin-top: 14px; }

.mob-cat-heading {
  display: grid;

  padding: 6px 4px;

  display: grid;

.mob-el-row.dimmed { opacity:0.15; pointer-events:none; }

/* ── BOTTOM SHEET ────────────────────────────────────────── */
.bottom-sheet {
  display: none;

  left:0; right:0; bottom:0;

.bs-head {

.bs-k { font-family:var(--font-mono); font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; }

.bs-canvas-wrap {

.bs-body { overflow-y:auto; padding:14px 16px 32px; flex:1; -webkit-overflow-scrolling:touch; }

/* ═══════════════════════════════════════════════════
   MOBILE LAYOUT  (< 768px)

  .bottom-sheet { display:flex; }
}

<script>
// ============================================================
//  MOLECULE DATA — all 20 molecules
//  Coordinates: Angstroms, centred at origin
//  el: element symbol, x/y/z: position
//  bonds: array of [atomIndex, atomIndex]
// ============================================================
const MOLECULES = [

// 1. Buckminsterfullerene C60
{
  id: 'c60',
  name: 'Buckminsterfullerene',
  formula: 'C₆₀',
  mw: '720.66 g/mol',
  category: 'carbon',
  year: '1985',
  desc: 'A truncated icosahedron of 60 carbon atoms arranged in 20 hexagons and 12 pentagons — soccer-ball geometry at the nanoscale. Nobel Prize in Chemistry 1996.',
  atoms: (function(){
    // Generate true C60 truncated icosahedron vertices
    const phi = (1 + Math.sqrt(5)) / 2;
    const verts = [];
    const perms = (a,b,c) => {
      const p = [[a,b,c],[a,c,b],[b,a,c],[b,c,a],[c,a,b],[c,b,a]];
      const signs = [-1,1];
      const out = [];
      p.forEach(([x,y,z]) => {
        signs.forEach(sx => signs.forEach(sy => signs.forEach(sz => {
          out.push([sx*x, sy*y, sz*z]);
        })));
      });
      return out;
    };
    // Truncated icosahedron vertices (3 classes)
    const r = 3.5; // scale
    const v1 = perms(0, 1, 3*phi).map(v => ({el:'C', x:v[0]*r/3.4, y:v[1]*r/3.4, z:v[2]*r/3.4}));
    const v2 = perms(1, 2+phi, 2*phi).map(v => ({el:'C', x:v[0]*r/3.4, y:v[1]*r/3.4, z:v[2]*r/3.4}));
    const v3 = perms(2, 2*phi+1, phi).map(v => ({el:'C', x:v[0]*r/3.4, y:v[1]*r/3.4, z:v[2]*r/3.4}));
    // Combine and deduplicate to get 60 unique
    const all = [...v1,...v2,...v3];
    const seen = new Set();
    const unique = [];
    all.forEach(v => {
      const key = `${v.x.toFixed(3)},${v.y.toFixed(3)},${v.z.toFixed(3)}`;
      if(!seen.has(key)){ seen.add(key); unique.push(v); }
    });
    return unique.slice(0,60);
  })(),
  bonds: (function(){
    const bonds = [];
    const phi = (1+Math.sqrt(5))/2;
    const r = 3.5;
    // Compute bonds by distance threshold
    return []; // filled after atoms known — computed in JS at render time
  })(),
  autoBonds: true,
  bondThreshold: 1.65
},

// 2. DNA Double Helix (simplified backbone)
{
  id: 'dna',
  name: 'DNA Double Helix',
  formula: '(C₁₀H₁₁N₄O₆P)ₙ',
  mw: '~650 g/mol per bp',
  category: 'biomolecule',
  year: '1953',
  desc: 'The iconic double-helical structure discovered by Watson and Crick. Two antiparallel phosphate-sugar backbone strands connected by nitrogenous base pairs encode genetic information.',
  atoms: (function(){
    const atoms = [];
    const steps = 14; // base pair steps
    const rise = 0.8;  // Å per step
    const twist = (2*Math.PI*36/360); // 36° per bp
    const r1 = 2.5, r2 = 2.5;
    for(let i=0;i<steps;i++){
      const a = i * twist;
      const y = (i - steps/2) * rise;
      // Strand 1 backbone
      atoms.push({el:'P', x:r1*Math.cos(a),    y, z:r1*Math.sin(a)});
      atoms.push({el:'O', x:r1*Math.cos(a)*0.7, y:y+0.3, z:r1*Math.sin(a)*0.7});
      atoms.push({el:'C', x:r1*Math.cos(a+0.4)*1.8, y:y+0.15, z:r1*Math.sin(a+0.4)*1.8});
      // Strand 2 backbone (antiparallel)
      const b = a + Math.PI;
      atoms.push({el:'P', x:r2*Math.cos(b),    y, z:r2*Math.sin(b)});
      atoms.push({el:'O', x:r2*Math.cos(b)*0.7, y:y-0.3, z:r2*Math.sin(b)*0.7});
      atoms.push({el:'C', x:r2*Math.cos(b+0.4)*1.8, y:y-0.15, z:r2*Math.sin(b+0.4)*1.8});
      // Base pair (N-N bridge)
      atoms.push({el:'N', x:r1*Math.cos(a)*0.4, y:y+0.05, z:r1*Math.sin(a)*0.4});
      atoms.push({el:'N', x:r2*Math.cos(b)*0.4, y:y-0.05, z:r2*Math.sin(b)*0.4});
    }
    return atoms;
  })(),
  bonds: (function(){
    const bonds = [];
    const steps = 14;
    for(let i=0;i<steps;i++){
      const base = i*8;
      // Strand 1: P-O-C
      bonds.push([base+0, base+1]);
      bonds.push([base+1, base+2]);
      // Strand 2: P-O-C
      bonds.push([base+3, base+4]);
      bonds.push([base+4, base+5]);
      // Base pair N-N
      bonds.push([base+6, base+7]);
      // Connect C to N bases
      bonds.push([base+2, base+6]);
      bonds.push([base+5, base+7]);
      // Backbone chain
      if(i>0){
        bonds.push([base-8+0, base+0]);
        bonds.push([base-8+3, base+3]);
      }
    }
    return bonds;
  })()
},

// 3. Hemoglobin (4 heme groups + simplified protein backbone)
{
  id: 'hemoglobin',
  name: 'Hemoglobin',
  formula: 'C₂₉₅₂H₄₆₆₄N₈₁₂O₈₃₂S₈Fe₄',
  mw: '64,458 g/mol',
  category: 'biomolecule',
  year: '1959',
  desc: 'The iron-containing oxygen-transport metalloprotein in red blood cells. Four subunits each carry a heme group whose central iron atom reversibly binds one O₂ molecule.',
  atoms: (function(){
    const atoms = [];
    // 4 heme centres
    const centres = [[-3,0,-3],[3,0,-3],[-3,0,3],[3,0,3]];
    centres.forEach(([cx,cy,cz]) => {
      // Central Fe
      atoms.push({el:'Fe', x:cx, y:cy, z:cz});
      // Porphyrin ring N atoms
      for(let i=0;i<4;i++){
        const a = i*Math.PI/2;
        atoms.push({el:'N', x:cx+1.2*Math.cos(a), y:cy+0.3, z:cz+1.2*Math.sin(a)});
      }
      // Carbon ring
      for(let i=0;i<8;i++){
        const a = i*Math.PI/4;
        atoms.push({el:'C', x:cx+2.0*Math.cos(a), y:cy+0.1*((i%2)-0.5), z:cz+2.0*Math.sin(a)});
      }
      // Axial histidine N
      atoms.push({el:'N', x:cx, y:cy-2.0, z:cz});
      atoms.push({el:'O', x:cx, y:cy+2.0, z:cz});
    });
    // Simplified alpha-helix backbone connections between subunits
    const helixPts = [
      {el:'C',x:-5,y:1,z:0},{el:'C',x:-4,y:2,z:1},{el:'C',x:-3,y:3,z:0},
      {el:'N',x:-2,y:2,z:-1},{el:'C',x:-1,y:1,z:0},{el:'C',x:0,y:2,z:1},
      {el:'C',x:1,y:3,z:0},{el:'N',x:2,y:2,z:-1},{el:'C',x:3,y:1,z:0},
      {el:'C',x:4,y:2,z:1},{el:'C',x:5,y:3,z:0},
    ];
    helixPts.forEach(p => atoms.push(p));
    return atoms;
  })(),
  bonds: (function(){
    const bonds = [];
    const centres = [[-3,0,-3],[3,0,-3],[-3,0,3],[3,0,3]];
    let base = 0;
    centres.forEach(() => {
      // Fe to 4 N
      for(let i=0;i<4;i++) bonds.push([base, base+1+i]);
      // N to adjacent C
      for(let i=0;i<4;i++){
        bonds.push([base+1+i, base+5+(i*2)]);
        bonds.push([base+1+i, base+5+(i*2+7)%8]);
      }
      // C ring
      for(let i=0;i<8;i++) bonds.push([base+5+i, base+5+(i+1)%8]);
      // axial
      bonds.push([base, base+13]);
      bonds.push([base, base+14]);
      base += 15;
    });
    // helix
    const hBase = base;
    for(let i=0;i<10;i++) bonds.push([hBase+i, hBase+i+1]);
    return bonds;
  })()
},

// 4. Chlorophyll a
{
  id: 'chlorophyll',
  name: 'Chlorophyll a',
  formula: 'C₅₅H₇₂MgN₄O₅',
  mw: '893.51 g/mol',
  category: 'biomolecule',
  year: '1818',
  desc: 'The primary pigment in plant photosynthesis. A magnesium porphyrin complex with a phytol tail that captures light energy and converts it to chemical energy.',
  atoms: (function(){
    const atoms = [];
    // Mg-porphyrin core
    atoms.push({el:'Mg', x:0, y:0, z:0});
    for(let i=0;i<4;i++){
      const a = i*Math.PI/2 + Math.PI/4;
      atoms.push({el:'N', x:1.5*Math.cos(a), y:0, z:1.5*Math.sin(a)});
    }
    // Porphyrin C ring (20 carbons in main ring)
    for(let i=0;i<20;i++){

{
  id: 'cyclodextrin',
  name: 'β-Cyclodextrin',
  formula: 'C₄₂H₇₀O₃₅',
  mw: '1134.98 g/mol',
  category: 'organic',
  year: '1891',
  desc: 'A cyclic oligosaccharide of 7 glucose units forming a truncated cone with a hydrophobic interior cavity. Widely used in pharmaceuticals to encapsulate and solubilise drug molecules.',
  atoms: (function(){
    const atoms = [];
    const n = 7; // glucose units
    for(let i=0;i<n;i++){
      const a = i*2*Math.PI/n;
      const cx = 4.5*Math.cos(a), cz = 4.5*Math.sin(a);
      // 6 C per glucose unit (simplified ring)
      for(let j=0;j<6;j++){
        const b = j*Math.PI/3;
        atoms.push({el:'C', x:cx+0.9*Math.cos(b), y:j<3?0.5:-0.5, z:cz+0.9*Math.sin(b)});
      }
      // O linking
      atoms.push({el:'O', x:cx, y:0, z:cz});
      // O in ring
      atoms.push({el:'O', x:cx+0.5*Math.cos(a+0.5), y:0.3, z:cz+0.5*Math.sin(a+0.5)});
      // OH groups
      atoms.push({el:'O', x:cx+1.5*Math.cos(a), y:1.2, z:cz+1.5*Math.sin(a)});
      atoms.push({el:'O', x:cx+1.5*Math.cos(a+Math.PI), y:-1.2, z:cz+1.5*Math.sin(a+Math.PI)});
    }
    return atoms;
  })(),
  bonds: (function(){
    const bonds = [];
    const n=7, perUnit=10;
    for(let i=0;i<n;i++){
      const base = i*perUnit;
      for(let j=0;j<5;j++) bonds.push([base+j, base+j+1]);
      bonds.push([base+5, base]);
      bonds.push([base, base+6],[base+1, base+7],[base+2, base+8],[base+3, base+9]);
      // Inter-glucose glycosidic O
      bonds.push([base+6, ((i+1)%n)*perUnit]);
    }
    return bonds;
  })()
},

// 18. Phthalocyanine
{
  id: 'phthalocyanine',
  name: 'Phthalocyanine',
  formula: 'C₃₂H₁₈N₈',
  mw: '514.54 g/mol',
  category: 'organic',
  year: '1907',
  desc: 'A planar aromatic macrocycle with an 18π-electron conjugated system. Intensely blue-green pigments (PB15, PG7) used in paints, inks, and as photosensitisers in photodynamic therapy.',
  atoms: (function(){
    const atoms = [];
    // 4 isoindole units + central N4 cavity
    for(let q=0;q<4;q++){
      const qa = q*Math.PI/2;
      // Isoindole benzene ring (4 C)
      for(let i=0;i<4;i++){
        const a = qa + i*Math.PI/2*0.6 - 0.3;
        atoms.push({el:'C', x:5.5*Math.cos(a), y:0, z:5.5*Math.sin(a)});
      }
      // Pyrrole N
      atoms.push({el:'N', x:2.5*Math.cos(qa+Math.PI/4), y:0, z:2.5*Math.sin(qa+Math.PI/4)});
      // Aza-bridge N
      atoms.push({el:'N', x:3.5*Math.cos(qa), y:0, z:3.5*Math.sin(qa)});
    }
    // Inner cavity atoms (2 NH)
    atoms.push({el:'N', x:0, y:0, z:1.4});
    atoms.push({el:'N', x:0, y:0, z:-1.4});
    atoms.push({el:'N', x:1.4, y:0, z:0});
    atoms.push({el:'N', x:-1.4, y:0, z:0});
    return atoms;
  })(),
  bonds: (function(){
    const bonds = [];
    const qBase = [0,6,12,18];
    qBase.forEach((b,q) => {

      bonds.push([b+4, b+3]);
      // Connect isoindole to cavity
      bonds.push([b+4, 24+q]);
      bonds.push([b+5, 24+(q+1)%4]);
    });
    // Aza bridges
    for(let q=0;q<4;q++){
      bonds.push([qBase[q]+5, qBase[(q+1)%4]+4]);
    }
    // Inner N-N ring
    bonds.push([24,26],[26,25],[25,27],[27,24]);
    return bonds;

{
  id: 'pamam',
  name: 'PAMAM Dendrimer (G1)',
  formula: '(C₂H₅N)core branched',
  mw: '~1430 g/mol',
  category: 'organic',
  year: '1985',
  desc: 'Generation-1 polyamidoamine dendrimer — a tree-like hyperbranched polymer grown from an ethylenediamine core. Used in drug delivery and gene transfection due to its programmable surface chemistry.',
  atoms: (function(){
    const atoms = [];
    // Core ethylenediamine
    atoms.push({el:'N', x:0, y:0, z:0});
    atoms.push({el:'C', x:0.8, y:0, z:0});
    atoms.push({el:'C', x:1.6, y:0, z:0});
    atoms.push({el:'N', x:2.4, y:0, z:0});
    // 4 branches from each terminal N
    const branchFrom = (cx,cy,cz,angle,depth=0) => {
      if(depth>1) return;
      const offsets = [Math.PI/4, -Math.PI/4, 3*Math.PI/4, -3*Math.PI/4];
      offsets.forEach(da => {
        const a = angle+da;
        const bx=cx+2*Math.cos(a), by=cy+2*Math.sin(da)*0.5, bz=cz+2*Math.sin(a);
        atoms.push({el:'C', x:bx, y:by, z:bz});
        atoms.push({el:'C', x:bx+0.8*Math.cos(a), y:by, z:bz+0.8*Math.sin(a)});
        atoms.push({el:'N', x:bx+1.6*Math.cos(a), y:by, z:bz+1.6*Math.sin(a)});
        atoms.push({el:'O', x:bx-0.5, y:by+0.8, z:bz});
      });
    };
    branchFrom(-0.5,0,0,Math.PI);
    branchFrom(2.9,0,0,0);
    return atoms;
  })(),
  bonds: (function(){
    const bonds = [];
    bonds.push([0,1],[1,2],[2,3]);
    let b=4;
    for(let side=0;side<2;side++){
      for(let br=0;br<4;br++){
        const root = side===0?0:3;
        bonds.push([root,b],[b,b+1],[b+1,b+2],[b,b+3]);
        b+=4;
      }
    }
    return bonds;
  })()
},

// ============================================================
//  PRE-COMPUTE AUTO-BONDS (once at load, not per frame)
// ============================================================
MOLECULES.forEach(m => {
  if(m.autoBonds) {
    const thresh = m.bondThreshold || 1.65;
    const atoms = m.atoms;
    const bonds = [];
    for(let i=0;i<atoms.length;i++){
      for(let j=i+1;j<atoms.length;j++){
        const dx=atoms[i].x-atoms[j].x, dy=atoms[i].y-atoms[j].y, dz=atoms[i].z-atoms[j].z;
        if(Math.sqrt(dx*dx+dy*dy+dz*dz) < thresh) bonds.push([i,j]);
      }
    }
    m.bonds = bonds;
    m.autoBonds = false; // mark as done
  }
});
const CPK = {
  C:'#8a9bb5', H:'#e8edf5', O:'#ff4d4d', N:'#4facfe',
  S:'#f5c518', P:'#ff8c42', Fe:'#e08040', Mg:'#34d399',
  Co:'#f472b6', Cl:'#34d399', Na:'#a78bfa', Ca:'#60a5fa',
  DEFAULT:'#c8d6f0'
};

// Van der Waals radii (Å) for space-filling
const VDW = {
  H:1.2, C:1.7, N:1.55, O:1.52, S:1.8, P:1.8, F:1.47,
  Cl:1.75, Fe:1.94, Mg:1.73, Co:1.92, Na:2.27, Ca:1.97,
  DEFAULT:1.7
};

// ============================================================
//  APP STATE
// ============================================================
let currentMol = null;
let displayMode = 'ball-stick'; // 'ball-stick' | 'space-fill'
let activeFilter = 'all';
let searchTerm = '';

// 3D rotation
let rotX = 0.3, rotY = 0.5;
let isDragging = false;
let lastX = 0, lastY = 0;
let zoom = 1.0;
let animFrame = null;
let autoRotate = true;

// ============================================================
//  SIDEBAR
// ============================================================
function buildStrip() {
  const strip = document.getElementById('molStrip');
  strip.innerHTML = '';
  const filtered = MOLECULES.filter(m => {
    const matchCat = activeFilter === 'all' || m.category === activeFilter;
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || m.name.toLowerCase().includes(q) || m.formula.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  const catColour = {organic:'var(--cat-organic)',biomolecule:'var(--cat-biomolecule)',carbon:'var(--cat-carbon)',organometallic:'var(--cat-organometallic)'};
  filtered.forEach(m => {
    const div = document.createElement('div');
    div.className = 'mol-card' + (currentMol && currentMol.id === m.id ? ' active' : '');
    div.innerHTML = `
      <div class="mol-card-symbol">${m.name}</div>
      <div class="mol-card-formula">${m.formula}</div>
      <span class="mol-card-dot" style="background:${catColour[m.category]}"></span>
    `;
    div.onclick = () => selectMolecule(m);
    strip.appendChild(div);
  });
  // Scroll active card into view
  if(currentMol) {
    const activeCard = strip.querySelector('.mol-card.active');
    if(activeCard) activeCard.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }
}

// Keep old name as alias for filter/search calls
function buildList() { buildStrip(); }

function setFilter(f) {

  document.querySelectorAll('.filter-btn').forEach(b => {

    allBtn.style.color='var(--accent)';allBtn.style.borderColor='var(--accent)';
  }
  buildList();
}

function selectMolecule(m) {

function updateDetail() {

  document.getElementById('noMol').classList.add('hidden');

// ============================================================
//  3D RENDERER
// ============================================================
const canvas = document.getElementById('molCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = document.getElementById('viewerWrap');
  canvas.width = wrap.clientWidth * window.devicePixelRatio;
  canvas.height = wrap.clientHeight * window.devicePixelRatio;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

function rotatePoint(x,y,z, rx,ry) {
  // Rotate Y then X
  let tx = x*Math.cos(ry) + z*Math.sin(ry);
  let tz = -x*Math.sin(ry) + z*Math.cos(ry);
  let ty = y*Math.cos(rx) - tz*Math.sin(rx);
  let tz2 = y*Math.sin(rx) + tz*Math.cos(rx);
  return [tx, ty, tz2];
}

function getAutoBonds(atoms, threshold) {
  const bonds = [];
  for(let i=0;i<atoms.length;i++){
    for(let j=i+1;j<atoms.length;j++){
      const dx=atoms[i].x-atoms[j].x, dy=atoms[i].y-atoms[j].y, dz=atoms[i].z-atoms[j].z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d < threshold) bonds.push([i,j]);
    }
  }
  return bonds;
}

function render() {
  if(!currentMol) return;

  resizeCanvas();
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  ctx.clearRect(0,0,W,H);

  const m = currentMol;
  const atoms = m.atoms;
  const bonds = m.bonds;

  // Compute bounding box to auto-scale
  let maxR = 0;
  atoms.forEach(a => { const r=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); if(r>maxR)maxR=r; });
  const baseScale = Math.min(W,H) / Math.max(maxR*2.8, 1) * zoom;

  // Project all atoms
  const projected = atoms.map(a => {
    const [px,py,pz] = rotatePoint(a.x, a.y, a.z, rotX, rotY);
    const screenX = cx + px * baseScale;
    const screenY = cy - py * baseScale;
    // Depth: -1 (back) to +1 (front)
    const depthMax = maxR || 1;
    const depth = pz / depthMax; // -1..1
    return {x:screenX, y:screenY, z:pz, depth, el:a.el};
  });

  // Sort by depth (back to front)
  const indices = projected.map((_,i)=>i).sort((a,b)=>projected[a].depth-projected[b].depth);

  // Draw bonds first (ball-stick only)
  if(displayMode === 'ball-stick') {
    bonds.forEach(([i,j]) => {
      if(i>=projected.length||j>=projected.length) return;
      const pa = projected[i], pb = projected[j];
      const depthMid = (pa.depth+pb.depth)/2;
      const alpha = 0.3 + 0.4*(depthMid+1)/2;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = `rgba(90,102,128,${alpha})`;
      ctx.lineWidth = Math.max(0.8, (1.5+depthMid)*window.devicePixelRatio*0.6);
      ctx.stroke();
    });
  }

  // Draw atoms
  indices.forEach(i => {
    const p = projected[i];
    const col = CPK[p.el] || CPK.DEFAULT;
    const depth01 = (p.depth+1)/2; // 0=back, 1=front

    let baseR;
    if(displayMode === 'space-fill') {
      const vdw = VDW[p.el] || VDW.DEFAULT;
      baseR = vdw * baseScale * 0.45;
    } else {
      const sizeMap = {H:0.25, C:0.38, N:0.38, O:0.38, S:0.45, P:0.45, Fe:0.55, Mg:0.5, Co:0.52};
      baseR = (sizeMap[p.el]||0.38) * baseScale;
    }

    const r = baseR * (0.55 + 0.45*depth01);
    const alpha = 0.4 + 0.6*depth01;

    // Parse colour for alpha version
    const parseHex = h => {
      const v = parseInt(h.slice(1),16);
      return [(v>>16)&255,(v>>8)&255,v&255];
    };
    const [cr,cg,cb] = parseHex(col);

    // Back glow / shadow
    if(depth01 < 0.5) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r*1.2, 0, 2*Math.PI);
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha*0.15})`;
      ctx.fill();
    }

    // Main sphere
    const grad = ctx.createRadialGradient(
      p.x - r*0.25, p.y - r*0.25, r*0.05,
      p.x, p.y, r
    );
    const brightR = Math.min(255,cr+80), brightG=Math.min(255,cg+80), brightB=Math.min(255,cb+80);
    const darkR = Math.max(0,cr-60), darkG=Math.max(0,cg-60), darkB=Math.max(0,cb-60);
    grad.addColorStop(0, `rgba(${brightR},${brightG},${brightB},${alpha})`);
    grad.addColorStop(0.6, `rgba(${cr},${cg},${cb},${alpha})`);
    grad.addColorStop(1, `rgba(${darkR},${darkG},${darkB},${alpha*0.8})`);

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, 2*Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();

    // Specular highlight
    if(depth01 > 0.3) {
      ctx.beginPath();
      ctx.arc(p.x - r*0.3, p.y - r*0.3, r*0.25, 0, 2*Math.PI);
      ctx.fillStyle = `rgba(255,255,255,${0.15*depth01})`;
      ctx.fill();
    }

    // Element label (ball-stick, not too small)
    if(displayMode === 'ball-stick' && r > 8 * window.devicePixelRatio) {
      ctx.fillStyle = `rgba(255,255,255,${alpha*0.9})`;
      ctx.font = `bold ${Math.round(r*0.7)}px 'Space Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.el, p.x, p.y);
    }
  });

  // Cache for tooltip hit-testing
  lastProjected = projected;
  lastBaseScale = baseScale;
}

// ============================================================
//  TOOLTIP INTERACTION
// ============================================================
canvas.addEventListener('mousemove', e => {
  if(isDragging) { hideTooltip(); return; }
  const hit = hitTest(e.clientX, e.clientY);
  if(hit) showTooltip(e.clientX, e.clientY, hit);
  else hideTooltip();
});

canvas.addEventListener('mouseleave', hideTooltip);

canvas.addEventListener('touchend', e => {
  if(isDragging) return;
  const t = e.changedTouches[0];
  const hit = hitTest(t.clientX, t.clientY);
  if(hit) {
    showTooltip(t.clientX, t.clientY, hit);
    setTimeout(hideTooltip, 2000);
  }
}, {passive:true});

// Cache last projected atoms for hit-testing
let lastProjected = [];
let lastBaseScale = 1;

function hitTest(clientX, clientY) {
  if(!currentMol || !lastProjected.length) return null;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const mx = (clientX - rect.left) * dpr;
  const my = (clientY - rect.top) * dpr;
  let best = null, bestDist = Infinity;
  lastProjected.forEach((p, i) => {
    const sizeMap = {H:0.25,C:0.38,N:0.38,O:0.38,S:0.45,P:0.45,Fe:0.55,Mg:0.5,Co:0.52};
    const r = (sizeMap[p.el]||0.38) * lastBaseScale * (0.55+0.45*(p.depth+1)/2);
    const dx = mx - p.x, dy = my - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < r && dist < bestDist) { bestDist = dist; best = {i, el:p.el}; }
  });
  return best;
}

const ELEMENT_NAMES = {
  H:'Hydrogen',C:'Carbon',N:'Nitrogen',O:'Oxygen',S:'Sulfur',P:'Phosphorus',
  Fe:'Iron',Mg:'Magnesium',Co:'Cobalt',Cl:'Chlorine',Na:'Sodium',Ca:'Calcium',
  F:'Fluorine',Zn:'Zinc',Cu:'Copper',Mn:'Manganese'
};

function showTooltip(clientX, clientY, hit) {
  const tooltip = document.getElementById('atomTooltip');
  const el = hit.el;
  const name = ELEMENT_NAMES[el] || el;
  const col = CPK[el] || CPK.DEFAULT;
  tooltip.innerHTML = `<span style="color:${col}">●</span> ${el} — ${name}<br><span style="color:var(--muted)">ATOM #${hit.i + 1}</span>`;
  const rect = document.getElementById('viewerWrap').getBoundingClientRect();
  let tx = clientX - rect.left + 12;
  let ty = clientY - rect.top - 40;
  if(tx + 160 > rect.width) tx = clientX - rect.left - 150;
  if(ty < 0) ty = clientY - rect.top + 12;
  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
  tooltip.classList.add('visible');
}

function hideTooltip() {
  document.getElementById('atomTooltip').classList.remove('visible');
}
let lastTime = 0;
function animate(ts) {
  if(autoRotate) {
    rotY += 0.007;
  }
  render();
  animFrame = requestAnimationFrame(animate);
}

function startRender() {
  if(animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(animate);
}

function resetView() {
  rotX = 0.3; rotY = 0.5; zoom = 1.0;
  autoRotate = true;
  updateRotateBadge();
}

function updateRotateBadge() {
  const badge = document.getElementById('rotateBadge');
  if(!badge) return;
  if(autoRotate) {
    badge.textContent = '● AUTO';
    badge.style.color = 'var(--accent2)';
    badge.style.borderColor = 'var(--accent2)';
  } else {
    badge.textContent = '◎ MANUAL';
    badge.style.color = 'var(--muted)';
    badge.style.borderColor = 'var(--border)';
  }
}
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  autoRotate = false;
  updateRotateBadge();
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  rotY += dx * 0.008;
  rotX += dy * 0.008;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mouseup', () => { isDragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.92 : 1.09;
  zoom = Math.max(0.2, Math.min(5, zoom));
}, {passive:false});

// Touch
let lastTouchX=0, lastTouchY=0;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length===1){
    isDragging=true; autoRotate=false;
    updateRotateBadge();
    lastTouchX=e.touches[0].clientX;
    lastTouchY=e.touches[0].clientY;
  }
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  if(!isDragging||e.touches.length!==1) return;
  const dx=e.touches[0].clientX-lastTouchX, dy=e.touches[0].clientY-lastTouchY;
  rotY+=dx*0.008; rotX+=dy*0.008;
  lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY;
}, {passive:true});

canvas.addEventListener('touchend', ()=>{isDragging=false;});

// Double-click also resets (desktop convenience)
canvas.addEventListener('dblclick', resetView);

// ============================================================
//  MODE TOGGLE
// ============================================================
function setMode(mode) {
  displayMode = mode;
  document.getElementById('btnBS').classList.toggle('active', mode==='ball-stick');
  document.getElementById('btnSF').classList.toggle('active', mode==='space-fill');
  document.getElementById('modeBadge').textContent = mode==='ball-stick' ? 'B & S' : 'FILL';
}

// ============================================================
//  INIT
// ============================================================
function init() {
  setFilter('all');
  window.addEventListener('resize', () => { if(currentMol) render(); });
  document.getElementById('noMol').classList.remove('hidden');
}


// ============================================================
//  MOBILE LIST BUILDER
// ============================================================
(function buildMobileList() {
  const container = document.getElementById('mobileList');
  if (!container) return;

  const CAT_ORDER = [
    { cat:'organic',        hex:'#4facfe', label:'Organic' },
    { cat:'biomolecule',    hex:'#34d399', label:'Biomolecules' },
    { cat:'carbon',         hex:'#8a9bb5', label:'Carbon Allotropes' },
    { cat:'organometallic', hex:'#f5c518', label:'Organometallic' },
  ];

  CAT_ORDER.forEach(({ cat, hex, label }) => {
    const mols = MOLECULES.filter(m => m.category === cat);
    if (!mols.length) return;

    const section = document.createElement('div');
    section.className = 'mob-cat-section';
    section.dataset.cat = cat;

    section.innerHTML = `
      <div class="mob-cat-heading">
        <div class="mob-cat-dot" style="background:${hex}"></div>
        <span class="mob-cat-title">${label}</span>
        <span class="mob-col-h">Year</span>
        <span class="mob-col-h mob-col-h-phase">●</span>
      </div>
    `;

    mols.forEach(m => {
      const row = document.createElement('div');
      row.className = 'mob-el-row';
      row.dataset.id = m.id;
      row.innerHTML = `
        <span class="mob-el-sym" style="color:${hex}">${m.formula.replace(/[₀-₉]/g,'').slice(0,3)}</span>
        <span class="mob-el-name">${m.name}</span>
        <span class="mob-el-year">${m.year}</span>
        <div><span class="mob-el-cat-dot" style="background:${hex}"></span></div>
      `;
      row.addEventListener('click', () => openBottomSheet(m));
      section.appendChild(row);
    });

    container.appendChild(section);
  });
})();

// ============================================================
//  BOTTOM SHEET
// ============================================================
let bsAnimFrame = null;
let bsRotX = 0.3, bsRotY = 0.5, bsZoom = 1.0;
let bsDragging = false, bsLastX = 0, bsLastY = 0;
let bsMol = null;

const bsCanvas = document.getElementById('bsMolCanvas');
const bsCtx = bsCanvas ? bsCanvas.getContext('2d') : null;

function openBottomSheet(m) {
  bsMol = m;
  bsRotX = 0.3; bsRotY = 0.5; bsZoom = 1.0;

  document.getElementById('bsName').textContent = m.name;
  document.getElementById('bsFormula').innerHTML = m.formula;
  document.getElementById('bsMW').textContent = m.mw;
  document.getElementById('bsCat').textContent = {
    organic:'Organic', biomolecule:'Biomolecule',
    carbon:'Carbon Allotrope', organometallic:'Organometallic'
  }[m.category];
  document.getElementById('bsYear').textContent = m.year;
  document.getElementById('bsDesc').textContent = m.desc;

  // Atom counts
  const counts = {};
  m.atoms.forEach(a => { counts[a.el] = (counts[a.el]||0)+1; });
  const ac = document.getElementById('bsAtoms');
  ac.innerHTML = '';
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([el,n]) => {
    const chip = document.createElement('div');
    chip.className = 'atom-chip';
    chip.innerHTML = `<div class="atom-dot" style="background:${CPK[el]||CPK.DEFAULT}"></div>${el} ${n}`;
    ac.appendChild(chip);
  });

  document.getElementById('bottomSheet').classList.add('open');
  setTimeout(startBsRender, 30);
}

function closeBottomSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  if (bsAnimFrame) { cancelAnimationFrame(bsAnimFrame); bsAnimFrame = null; }
  bsMol = null;
}

document.getElementById('bsClose').addEventListener('click', closeBottomSheet);

// Swipe-down to close
let bsTouchStartY = 0;
const sheet = document.getElementById('bottomSheet');
sheet.addEventListener('touchstart', e => { bsTouchStartY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - bsTouchStartY;
  if (dy > 80) closeBottomSheet();
}, {passive:true});

// Canvas interaction
function bsResizeCanvas() {
  if (!bsCanvas) return;
  const wrap = bsCanvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  bsCanvas.width  = wrap.clientWidth  * dpr;
  bsCanvas.height = wrap.clientHeight * dpr;
  bsCanvas.style.width  = wrap.clientWidth  + 'px';
  bsCanvas.style.height = wrap.clientHeight + 'px';
}

function renderBs() {
  if (!bsMol || !bsCtx) return;
  bsResizeCanvas();
  const W = bsCanvas.width, H = bsCanvas.height;
  const cx = W/2, cy = H/2;
  bsCtx.clearRect(0,0,W,H);

  const atoms = bsMol.atoms;
  const bonds = bsMol.bonds;
  let maxR = 0;
  atoms.forEach(a => { const r=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); if(r>maxR)maxR=r; });
  const baseScale = Math.min(W,H) / Math.max(maxR*2.8,1) * bsZoom;

  const projected = atoms.map(a => {
    const [px,py,pz] = rotatePoint(a.x,a.y,a.z, bsRotX, bsRotY);
    return {x:cx+px*baseScale, y:cy-py*baseScale, z:pz, depth:pz/(maxR||1), el:a.el};
  });
  const indices = projected.map((_,i)=>i).sort((a,b)=>projected[a].depth-projected[b].depth);

  // bonds
  bonds.forEach(([i,j]) => {
    if(i>=projected.length||j>=projected.length) return;
    const pa=projected[i], pb=projected[j];
    const alpha = 0.3+0.4*((pa.depth+pb.depth)/2+1)/2;
    bsCtx.beginPath();
    bsCtx.moveTo(pa.x,pa.y);
    bsCtx.lineTo(pb.x,pb.y);
    bsCtx.strokeStyle=`rgba(90,102,128,${alpha})`;
    bsCtx.lineWidth=Math.max(0.8,1.5*(window.devicePixelRatio||1)*0.6);
    bsCtx.stroke();
  });

  // atoms
  indices.forEach(i => {
    const p=projected[i];
    const col=CPK[p.el]||CPK.DEFAULT;
    const depth01=(p.depth+1)/2;
    const sizeMap={H:0.25,C:0.38,N:0.38,O:0.38,S:0.45,P:0.45,Fe:0.55,Mg:0.5,Co:0.52};
    const r=(sizeMap[p.el]||0.38)*baseScale*(0.55+0.45*depth01);
    const alpha=0.4+0.6*depth01;
    const parseHex=h=>{const v=parseInt(h.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255];};
    const [cr,cg,cb]=parseHex(col);
    const grad=bsCtx.createRadialGradient(p.x-r*0.25,p.y-r*0.25,r*0.05,p.x,p.y,r);
    grad.addColorStop(0,`rgba(${Math.min(255,cr+80)},${Math.min(255,cg+80)},${Math.min(255,cb+80)},${alpha})`);
    grad.addColorStop(0.6,`rgba(${cr},${cg},${cb},${alpha})`);
    grad.addColorStop(1,`rgba(${Math.max(0,cr-60)},${Math.max(0,cg-60)},${Math.max(0,cb-60)},${alpha*0.8})`);
    bsCtx.beginPath(); bsCtx.arc(p.x,p.y,r,0,2*Math.PI);
    bsCtx.fillStyle=grad; bsCtx.fill();
    if(depth01>0.3){
      bsCtx.beginPath(); bsCtx.arc(p.x-r*0.3,p.y-r*0.3,r*0.25,0,2*Math.PI);
      bsCtx.fillStyle=`rgba(255,255,255,${0.15*depth01})`; bsCtx.fill();
    }
  });
}

function startBsRender() {
  if(bsAnimFrame) cancelAnimationFrame(bsAnimFrame);
  let autoRot = true;
  function loop() {
    if(autoRot) bsRotY += 0.008;
    renderBs();
    bsAnimFrame = requestAnimationFrame(loop);
  }
  bsAnimFrame = requestAnimationFrame(loop);

  // touch drag on bs canvas
  bsCanvas.addEventListener('touchstart', e => {
    if(e.touches.length===1){ bsDragging=true; autoRot=false; bsLastX=e.touches[0].clientX; bsLastY=e.touches[0].clientY; }
  },{passive:true,once:false});
  bsCanvas.addEventListener('touchmove', e => {
    if(!bsDragging||e.touches.length!==1) return;
    bsRotY+=(e.touches[0].clientX-bsLastX)*0.01;
    bsRotX+=(e.touches[0].clientY-bsLastY)*0.01;
    bsLastX=e.touches[0].clientX; bsLastY=e.touches[0].clientY;
  },{passive:true});
  bsCanvas.addEventListener('touchend',()=>{bsDragging=false;},{passive:true});
}

init();
</script>
