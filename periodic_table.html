<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%224%22%20fill%3D%22%2307090f%22/%3E%0A%20%20%3Cellipse%20cx%3D%2216%22%20cy%3D%2216%22%20rx%3D%2213%22%20ry%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%2300e5ff%22%20stroke-width%3D%221.4%22/%3E%0A%20%20%3Cellipse%20cx%3D%2216%22%20cy%3D%2216%22%20rx%3D%2213%22%20ry%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%2300e5ff%22%20stroke-width%3D%221.4%22%20transform%3D%22rotate%2860%2016%2016%29%22/%3E%0A%20%20%3Cellipse%20cx%3D%2216%22%20cy%3D%2216%22%20rx%3D%2213%22%20ry%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%2300e5ff%22%20stroke-width%3D%221.4%22%20transform%3D%22rotate%28120%2016%2016%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%223%22%20fill%3D%22%2300e5ff%22/%3E%0A%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07090f;
  --surface: #0d1117;
  --border: #1e2433;
  --text: #c8d6f0;
  --muted: #5a6680;

  /* Category colours (default/filter mode) */
  --c-alkali:      #ff4d6d;
  --c-alkaline:    #ff8c42;
  --c-transition:  #4facfe;
  --c-post:        #a78bfa;
  --c-metalloid:   #34d399;
  --c-nonmetal:    #fbbf24;
  --c-noble:       #f472b6;
  --c-lanthanide:  #60a5fa;
  --c-actinide:    #f87171;
  --c-unknown:     #6b7280;

  /* Phase colours */
  --c-solid:   #4facfe;
  --c-liquid:  #34d399;
  --c-gas:     #c084fc;
  --c-unknown-phase: #3a4560;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: auto;
  margin: 0;
}
.page {
  min-width: 1043px;
  width: 1043px;
}

/* ── HEADER ── */
header {
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  width: 1043px;
  box-sizing: border-box;
}
.header-left { display: flex; align-items: baseline; gap: 14px; flex-shrink: 0; }
header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  letter-spacing: 3px;
  color: #fff;
  line-height: 1;
}
header p { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.header-phase {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.header-phase label {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  color: var(--muted);
  white-space: nowrap;
}
.header-phase input[type=range] {
  width: 140px;
  accent-color: #4facfe;
  cursor: pointer;
}
.temp-val {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  color: #4facfe;
  min-width: 52px;
}
.phase-legend { display: flex; gap: 10px; align-items: center; }
.pl-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 0.58rem;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  white-space: nowrap;
}
.pl-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* ── CONTROLS ── */
.controls {
  padding: 10px 28px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid var(--border);
  min-width: 975px;
}
.controls input[type=text] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  padding: 5px 11px;
  font-size: 0.8rem;
  font-family: 'Space Mono', monospace;
  width: 160px;
  outline: none;
  transition: border 0.15s;
}
.controls input[type=text]:focus { border-color: #4facfe; }

.sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

.filter-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 0.63rem;
  padding: 4px 7px 3px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.filter-btn[data-cat]::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--col, transparent);
  opacity: 0.7;
}
.filter-btn[data-cat]:hover,
.filter-btn[data-cat].active {
  border-color: var(--col);
  color: var(--col);
  background: color-mix(in srgb, var(--col) 12%, transparent);
}
.filter-btn[data-cat]:hover::before,
.filter-btn[data-cat].active::before {
  opacity: 1;
}
.filter-btn.clear-btn:hover { border-color: var(--text); color: var(--text); }

/* temp-bar moved to header */

/* ── TABLE ── */
.table-wrap { padding: 16px 28px 6px; overflow-x: auto; }

/*
  Standard layout: 18 groups × (7 main rows + 1 gap row + 2 f-block rows) = 10 rows
  Col positions:  groups 1–2 map to cols 1–2; groups 3–18 map to cols 3–18 for main table
  Lanthanides: row 9, cols 4–17 (La=col4 … Lu=col17)  + label col3
  Actinides:   row 10, cols 4–17 (Ac=col4 … Lr=col17) + label col3
*/
.pt-grid {
  display: grid;
  grid-template-columns: repeat(18, 52px);
  grid-template-rows: repeat(7, 52px) 20px repeat(2, 52px);
  gap: 3px;
  min-width: 975px;
}

.el {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s, background 0.3s, opacity 0.2s;
  overflow: hidden;
}
.el::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background: var(--phase-bg, transparent);
  opacity: 0.18;
  pointer-events: none;
  transition: background 0.3s, opacity 0.3s;
}
.el .top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2.5px;
  background: var(--el-color, var(--muted));
  border-radius: 4px 4px 0 0;
  transition: background 0.3s;
}
.el:hover {
  transform: scale(1.18);
  z-index: 20;
  border-color: var(--el-color, #4facfe);
  box-shadow: 0 0 18px color-mix(in srgb, var(--el-color, #4facfe) 50%, transparent);
}
.el.dimmed { opacity: 0.12; pointer-events: none; }
.el.highlighted { opacity: 1; }

.el .z {
  font-family: 'Space Mono', monospace;
  font-size: 0.48rem;
  color: var(--muted);
  align-self: flex-start;
  margin-left: 3px;
  line-height: 1;
}
.el .sym {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.25rem;
  color: var(--el-color, var(--text));
  line-height: 1;
  margin-top: 1px;
  transition: color 0.3s;
}
.el .el-name {
  font-size: 0.4rem;
  color: var(--muted);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  width: 100%;
  padding: 0 2px;
  line-height: 1.2;
}
.el .el-mass {
  font-family: 'Space Mono', monospace;
  font-size: 0.4rem;
  color: #2a3550;
  line-height: 1;
}

/* f-block label cells */
.f-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 4px;
  cursor: default;
  opacity: 0.5;
}

/* row 8 gap */
.gap-row { grid-column: 1 / span 18; height: 8px; }

/* legend removed */

/* ── DETAIL PANEL ── */
.panel {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 300px;
  background: #090c14;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.24s cubic-bezier(0.22,1,0.36,1);
  z-index: 200;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel-head {
  padding: 22px 22px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
  background: #0b0e17;
  flex-shrink: 0;
}
.close-btn {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none; color: var(--muted);
  font-size: 1.1rem; cursor: pointer; font-family: monospace;
  transition: color 0.15s; line-height: 1;
}
.close-btn:hover { color: #fff; }

.p-sym {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 4rem;
  line-height: 1;
}
.p-name { font-size: 1rem; font-weight: 500; color: #fff; margin-top: 2px; }
.p-meta { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 4px; }
.p-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.badge {
  font-size: 0.6rem; font-family: 'Space Mono', monospace;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px;
}

.panel-body { overflow-y: auto; padding: 16px 22px 24px; flex: 1; }
.p-section {
  font-size: 0.58rem; font-family: 'Space Mono', monospace;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin: 16px 0 6px;
}
.p-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0; border-bottom: 1px solid #0f1624;
  font-size: 0.78rem;
}
.p-row .lbl { color: var(--muted); font-size: 0.68rem; }
.p-row .val { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text); text-align: right; }
.config-box {
  background: #0d1117; border: 1px solid var(--border); border-radius: 5px;
  padding: 9px 12px; font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: #4facfe; word-break: break-word; line-height: 1.7;
}
.phase-pill {
  display: inline-block; font-size: 0.62rem; font-family: 'Space Mono', monospace;
  padding: 2px 7px; border-radius: 3px;
}
.phase-pill.solid   { background:#1e3a5f; color:#60a5fa; }
.phase-pill.liquid  { background:#1a3d2e; color:#34d399; }
.phase-pill.gas     { background:#2d1a4d; color:#c084fc; }
.phase-pill.unknown-phase { background:#1f2937; color:#6b7280; }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="header-left">
    <h1>Periodic Table</h1>
    <p>118 Elements · Interactive</p>
  </div>
  <div class="header-phase">
    <label>Phase at:</label>
    <input type="range" id="tempSlider" min="-273" max="6000" value="25" step="5">
    <span class="temp-val" id="tempVal">25 °C</span>
    <div class="phase-legend">
      <div class="pl-item"><div class="pl-dot" style="background:var(--c-solid)"></div>Solid</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--c-liquid)"></div>Liquid</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--c-gas)"></div>Gas</div>
      <div class="pl-item"><div class="pl-dot" style="background:#3a4560"></div>Unknown</div>
    </div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Name, symbol or Z…">
  <button class="filter-btn clear-btn" id="clear-btn">✕ Clear</button>
  <div class="sep"></div>
  <button class="filter-btn" data-cat="Alkali Metal"     style="--col:var(--c-alkali);margin-left:auto">Alkali</button>
  <button class="filter-btn" data-cat="Alkaline Earth"   style="--col:var(--c-alkaline)">Alkaline Earth</button>
  <button class="filter-btn" data-cat="Transition Metal" style="--col:var(--c-transition)">Transition</button>
  <button class="filter-btn" data-cat="Post-Transition"  style="--col:var(--c-post)">Post-Trans.</button>
  <button class="filter-btn" data-cat="Metalloid"        style="--col:var(--c-metalloid)">Metalloid</button>
  <button class="filter-btn" data-cat="Nonmetal"         style="--col:var(--c-nonmetal)">Nonmetal</button>
  <button class="filter-btn" data-cat="Noble Gas"        style="--col:var(--c-noble)">Noble Gas</button>
  <button class="filter-btn" data-cat="Lanthanide"       style="--col:var(--c-lanthanide)">Lanthanide</button>
  <button class="filter-btn" data-cat="Actinide"         style="--col:var(--c-actinide)">Actinide</button>
</div>



<div class="table-wrap">
  <div class="pt-grid" id="grid"></div>
</div>


</div><!-- /.page -->

<!-- Detail Panel -->
<div class="panel" id="panel">
  <div class="panel-head">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="p-sym" id="pSym"></div>
    <div class="p-name" id="pName"></div>
    <div class="p-meta" id="pMeta"></div>
    <div class="p-badges" id="pBadges"></div>
  </div>
  <div class="panel-body" id="pBody"></div>
</div>

function getPhase(el, t) {
  if (el.melt === null || el.boil === null) return 'unknown';
  if (t < el.melt) return 'solid';
  if (t < el.boil) return 'liquid';
  return 'gas';
}

  d.style.cssText = `grid-column:${el.col};grid-row:${el.row};`;
  d.innerHTML = `
    <div class="top-bar"></div>
    <span class="z">${el.z}</span>
    <span class="sym">${el.s}</span>
    <span class="el-name">${el.n}</span>
    <span class="el-mass">${el.m}</span>
  `;
  d.addEventListener('click', () => openPanel(el));
  grid.appendChild(d);
  elDivs[el.z] = d;
});

// ─── COLOUR CELLS ───────────────────────────────────────────────────────────
function updateCellColors() {
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    const topBar = d.querySelector('.top-bar');
    const symEl  = d.querySelector('.sym');

    if (phaseMode) {
      const phase = getPhase(el, currentTemp);
      const c = PHASE_COLORS[phase];
      d.style.setProperty('--el-color', c);
      d.style.setProperty('--phase-bg', c);
      topBar.style.background = c;
      symEl.style.color = c;
    } else {
      const c = CAT[el.cat] || 'var(--c-unknown)';
      d.style.setProperty('--el-color', c);
      d.style.setProperty('--phase-bg', 'transparent');
      topBar.style.background = c;
      symEl.style.color = c;
    }
  });
}

updateCellColors();

// ─── TEMP SLIDER ────────────────────────────────────────────────────────────
const slider = document.getElementById('tempSlider');
const tempValEl = document.getElementById('tempVal');

slider.addEventListener('input', function() {
  currentTemp = parseInt(this.value);
  phaseMode = true;
  tempValEl.textContent = currentTemp + ' °C';
  updateCellColors();
  // If panel open, refresh phase pill
  if (document.getElementById('panel').classList.contains('open') && openedEl) {
    refreshPhasePill(openedEl);
  }
});

// ─── FILTER ─────────────────────────────────────────────────────────────────
function applyFilter(cat) {
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    if (!cat) {
      d.classList.remove('dimmed','highlighted');
    } else if (el.cat === cat) {
      d.classList.remove('dimmed'); d.classList.add('highlighted');
    } else {
      d.classList.add('dimmed'); d.classList.remove('highlighted');
    }
  });
  // Dim/restore the f-block placeholder boxes in the main table
  const lantMatch = !cat || cat === 'Lanthanide';
  const actMatch  = !cat || cat === 'Actinide';
  [phLa, phLaLabel].forEach(d => { if(d) d.style.opacity = lantMatch ? '1' : '0.12'; });
  [phAc, phAcLabel].forEach(d => { if(d) d.style.opacity = actMatch  ? '1' : '0.12'; });
}

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    if (activeFilter === cat) {
      activeFilter = '';
      btn.classList.remove('active');
    } else {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    applyFilter(activeFilter);
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  activeFilter = '';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  applyFilter('');
  document.getElementById('search').value = '';
  applyFilter('');
});

// ─── SEARCH ─────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { applyFilter(activeFilter); return; }
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    const match = el.n.toLowerCase().includes(q) || el.s.toLowerCase() === q || String(el.z) === q;
    if (match) { d.classList.remove('dimmed'); d.classList.add('highlighted'); }
    else        { d.classList.add('dimmed'); d.classList.remove('highlighted'); }
  });
});

// ─── DETAIL PANEL ───────────────────────────────────────────────────────────
let openedEl = null;

function refreshPhasePill(el) {
  const phase = getPhase(el, currentTemp);
  const labels = {solid:'Solid',liquid:'Liquid',gas:'Gas',unknown:'Unknown'};
  const pill = document.getElementById('phasePill');
  if (pill) {
    pill.className = `phase-pill ${phase === 'unknown' ? 'unknown-phase' : phase}`;
    pill.textContent = labels[phase] + ' at ' + currentTemp + '°C';
  }
}

function openPanel(el) {
  openedEl = el;
  const color = CAT[el.cat] || 'var(--c-unknown)';

  document.getElementById('pSym').textContent = el.s;
  document.getElementById('pSym').style.color = color;
  document.getElementById('pName').textContent = el.n;
  document.getElementById('pMeta').textContent = `Z = ${el.z}  ·  Period ${el.row <= 7 ? el.row : (el.row === 9 ? 6 : 7)}`;
  document.getElementById('pBadges').innerHTML = `
    <span class="badge" style="background:color-mix(in srgb,${color} 15%,transparent);color:${color};border:1px solid color-mix(in srgb,${color} 30%,transparent)">${el.cat}</span>
    <span class="phase-pill ${(() => { const p = getPhase(el,currentTemp); return p==='unknown'?'unknown-phase':p; })()} " id="phasePill">${(() => { const p=getPhase(el,currentTemp); return {solid:'Solid',liquid:'Liquid',gas:'Gas',unknown:'Unknown'}[p]+' at '+currentTemp+'°C'; })()}</span>
  `;

  const fmt = v => v != null ? v : '—';

  document.getElementById('pBody').innerHTML = `
    <div class="p-section">Physical Properties</div>
    <div class="p-row"><span class="lbl">Atomic Mass</span><span class="val">${el.m} u</span></div>
    <div class="p-row"><span class="lbl">Density</span><span class="val">${fmt(el.den)} g/cm³</span></div>
    <div class="p-row"><span class="lbl">Melting Point</span><span class="val">${fmt(el.melt)} °C</span></div>
    <div class="p-row"><span class="lbl">Boiling Point</span><span class="val">${fmt(el.boil)} °C</span></div>
    <div class="p-section">Identity</div>
    <div class="p-row"><span class="lbl">Atomic Number</span><span class="val">${el.z}</span></div>
    <div class="p-row"><span class="lbl">Symbol</span><span class="val">${el.s}</span></div>
    <div class="p-row"><span class="lbl">Category</span><span class="val">${el.cat}</span></div>
    <div class="p-row"><span class="lbl">Discovered</span><span class="val">${el.disc}</span></div>
    <div class="p-section">Electron Configuration</div>
    <div class="config-box">${el.cfg}</div>
  `;

  document.getElementById('panel').classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  openedEl = null;
});

// legend removed
</script>
</body>
</html>
