<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07090f;
  --surface: #0d1117;
  --border: #1e2433;
  --text: #c8d6f0;
  --muted: #5a6680;

  /* Category colours (default/filter mode) */
  --c-alkali:      #ff4d6d;
  --c-alkaline:    #ff8c42;
  --c-transition:  #4facfe;
  --c-post:        #a78bfa;
  --c-metalloid:   #34d399;
  --c-nonmetal:    #fbbf24;
  --c-noble:       #f472b6;
  --c-lanthanide:  #60a5fa;
  --c-actinide:    #f87171;
  --c-unknown:     #6b7280;

  /* Phase colours */
  --c-solid:   #4facfe;
  --c-liquid:  #34d399;
  --c-gas:     #c084fc;
  --c-unknown-phase: #3a4560;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: auto;
  margin: 0;
}
.page {
  min-width: 1043px;
  width: 1043px;
  transform-origin: top left;
}

/* ── HEADER ── */
header {
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  width: 1043px;
  box-sizing: border-box;
}
.header-left { display: flex; align-items: baseline; gap: 14px; flex-shrink: 0; }
header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  letter-spacing: 3px;
  color: #fff;
  line-height: 1;
}
header p { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.header-phase {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.header-phase label {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  color: var(--muted);
  white-space: nowrap;
}
.header-phase input[type=range] {
  width: 140px;
  accent-color: #4facfe;
  cursor: pointer;
}
.temp-val {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  color: #4facfe;
  min-width: 52px;
}
.phase-legend { display: flex; gap: 10px; align-items: center; }
.pl-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 0.58rem;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  white-space: nowrap;
}
.pl-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* ── CONTROLS ── */
.controls {
  padding: 10px 28px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid var(--border);
  min-width: 975px;
}
.controls input[type=text] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  padding: 5px 11px;
  font-size: 0.8rem;
  font-family: 'Space Mono', monospace;
  width: 160px;
  outline: none;
  transition: border 0.15s;
}
.controls input[type=text]:focus { border-color: #4facfe; }

.sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

.filter-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 0.63rem;
  padding: 4px 7px 3px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.filter-btn[data-cat]::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--col, transparent);
  opacity: 0.7;
}
.filter-btn[data-cat]:hover,
.filter-btn[data-cat].active {
  border-color: var(--col);
  color: var(--col);
  background: color-mix(in srgb, var(--col) 12%, transparent);
}
.filter-btn[data-cat]:hover::before,
.filter-btn[data-cat].active::before {
  opacity: 1;
}
.filter-btn.clear-btn:hover { border-color: var(--text); color: var(--text); }

/* temp-bar moved to header */

/* ── TABLE ── */
.table-wrap { padding: 16px 28px 6px; overflow-x: auto; }

/*
  Standard layout: 18 groups × (7 main rows + 1 gap row + 2 f-block rows) = 10 rows
  Col positions:  groups 1–2 map to cols 1–2; groups 3–18 map to cols 3–18 for main table
  Lanthanides: row 9, cols 4–17 (La=col4 … Lu=col17)  + label col3
  Actinides:   row 10, cols 4–17 (Ac=col4 … Lr=col17) + label col3
*/
.pt-grid {
  display: grid;
  grid-template-columns: repeat(18, 52px);
  grid-template-rows: repeat(7, 52px) 20px repeat(2, 52px);
  gap: 3px;
  min-width: 975px;
}

.el {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s, background 0.3s, opacity 0.2s;
  overflow: hidden;
}
.el::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background: var(--phase-bg, transparent);
  opacity: 0.18;
  pointer-events: none;
  transition: background 0.3s, opacity 0.3s;
}
.el .top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2.5px;
  background: var(--el-color, var(--muted));
  border-radius: 4px 4px 0 0;
  transition: background 0.3s;
}
.el:hover {
  transform: scale(1.18);
  z-index: 20;
  border-color: var(--el-color, #4facfe);
  box-shadow: 0 0 18px color-mix(in srgb, var(--el-color, #4facfe) 50%, transparent);
}
.el.dimmed { opacity: 0.12; pointer-events: none; }
.el.highlighted { opacity: 1; }

.el .z {
  font-family: 'Space Mono', monospace;
  font-size: 0.48rem;
  color: var(--muted);
  align-self: flex-start;
  margin-left: 3px;
  line-height: 1;
}
.el .sym {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.25rem;
  color: var(--el-color, var(--text));
  line-height: 1;
  margin-top: 1px;
  transition: color 0.3s;
}
.el .el-name {
  font-size: 0.4rem;
  color: var(--muted);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  width: 100%;
  padding: 0 2px;
  line-height: 1.2;
}
.el .el-mass {
  font-family: 'Space Mono', monospace;
  font-size: 0.4rem;
  color: #2a3550;
  line-height: 1;
}

/* f-block label cells */
.f-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 4px;
  cursor: default;
  opacity: 0.5;
}

/* row 8 gap */
.gap-row { grid-column: 1 / span 18; height: 8px; }

/* legend removed */

/* ── DETAIL PANEL ── */
.panel {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 300px;
  background: #090c14;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.24s cubic-bezier(0.22,1,0.36,1);
  z-index: 200;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel-head {
  border-bottom: 1px solid var(--border);
  position: relative;
  background: #0b0e17;
  flex-shrink: 0;
  overflow: hidden;
  padding: 14px 18px 10px;
}
.panel-head-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.panel-head-sym {
  flex-shrink: 0;
  line-height: 1;
}
.panel-head-text {
  flex: 1;
  min-width: 0;
  padding-top: 2px;
}
.panel-atom {
  width: 100%;
  height: 220px;
  display: block;
  flex-shrink: 0;
  overflow: hidden;
}
.panel-atom canvas {
  display: block;
  width: 100% !important;
  height: 220px !important;
}
.close-btn {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none; color: var(--muted);
  font-size: 1.1rem; cursor: pointer; font-family: monospace;
  transition: color 0.15s; line-height: 1;
}
.close-btn:hover { color: #fff; }

.p-sym {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.2rem;
  line-height: 1;
}
.p-name { font-size: 1rem; font-weight: 500; color: #fff; margin-top: 2px; }
.p-meta { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 4px; }
.p-badges { display: flex; gap: 6px; padding: 6px 0 4px 0; flex-wrap: nowrap; align-items: center; }
.badge {
  font-size: 0.6rem; font-family: 'Space Mono', monospace;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px;
}

.panel-body { overflow-y: auto; padding: 16px 22px 24px; flex: 1; }
.p-section {
  font-size: 0.58rem; font-family: 'Space Mono', monospace;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin: 16px 0 6px;
}
.p-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0; border-bottom: 1px solid #0f1624;
  font-size: 0.78rem;
}
.p-row .lbl { color: var(--muted); font-size: 0.68rem; }
.p-row .val { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text); text-align: right; }
.config-box {
  background: #0d1117; border: 1px solid var(--border); border-radius: 5px;
  padding: 9px 12px; font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: #4facfe; word-break: break-word; line-height: 1.7;
}
.phase-pill {
  display: inline-block; font-size: 0.55rem; font-family: 'Space Mono', monospace;
  padding: 3px 7px; border-radius: 3px;
  white-space: nowrap;
}
.phase-pill.solid   { background:#1e3a5f; color:#60a5fa; }
.phase-pill.liquid  { background:#1a3d2e; color:#34d399; }
.phase-pill.gas     { background:#2d1a4d; color:#c084fc; }
.phase-pill.unknown-phase { background:#1f2937; color:#6b7280; }

/* ── Mobile element list (hidden by default, shown by @media below) ── */
.mobile-list {
  display: none;
  padding: 0 16px 24px;
}

/* ═══════════════════════════════════════════════════════
   MOBILE LAYOUT  (<768px)
   ─ Scrollable element list instead of the grid
   ─ Header/controls collapse to stacked layout
   ─ Detail panel = full-screen bottom sheet
   ═══════════════════════════════════════════════════════ */
@media (max-width: 767px) {

  /* Page no longer needs fixed desktop width */
  .page {
    min-width: 0;
    width: 100%;
    transform: none !important; /* override JS autoScale */
    margin-bottom: 0 !important;
  }

  /* ── Header ── */
  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 16px;
    width: 100%;
  }
  .header-left { gap: 8px; }
  header h1 { font-size: 1.7rem; letter-spacing: 2px; }
  .header-phase {
    margin-left: 0;
    width: 100%;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-phase input[type=range] { width: 100%; flex: 1 1 120px; }
  .phase-legend { width: 100%; flex-wrap: wrap; gap: 8px; }

  /* ── Controls ── */
  .controls {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    padding: 8px 16px;
    min-width: 0;
  }
  .controls input[type=text] {
    width: 100%;
    font-size: 0.9rem;
    padding: 8px 12px;
  }
  .sep { display: none; }
  .controls-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .filter-btn {
    font-size: 0.68rem;
    padding: 5px 9px 4px;
    flex: 0 0 auto;
  }
  /* clear btn full width on mobile */
  #clear-btn { width: 100%; text-align: center; margin-bottom: 2px; }

  /* ── Hide desktop grid, show mobile list ── */
  .table-wrap { display: none; }
  .mobile-list { display: block; }

  /* ── Detail panel: full-screen bottom sheet ── */
  .panel {
    right: 0; left: 0; top: auto; bottom: 0;
    width: 100%;
    max-height: 92vh;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1);
    border-left: none;
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    overflow: hidden;
  }
  .panel.open { transform: translateY(0); }

  /* drag handle */
  .panel::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 8px auto 0;
    flex-shrink: 0;
  }

  .panel-atom canvas { height: 200px !important; }
  .panel-atom { height: 200px; }

  /* Atom canvas full width */
  .panel-head { padding: 10px 16px 8px; }
}

/* ── Mobile element list items ── */
.mob-cat-section {
  margin-top: 16px;
}
.mob-cat-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}
.mob-cat-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
.mob-cat-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
/* ── Shared column grid: heading + every data row use identical template ── */
.mob-cat-heading,
.mob-el-row {
  display: grid;
  grid-template-columns: 40px 1fr 58px 58px 44px;
  align-items: center;
  gap: 0;
}

/* Column headers — sit in same grid columns as data */
.mob-cat-heading {
  padding: 6px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}
/* dot + title together span cols 1–2 */
.mob-cat-dot-title {
  display: flex;
  align-items: center;
  gap: 8px;
  grid-column: 1 / 3;
}
.mob-cat-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
.mob-cat-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
/* individual column header labels */
.mob-col-h {
  font-family: 'Space Mono', monospace;
  font-size: 0.50rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #2a3550;
  text-align: right;
}
.mob-col-h-phase { text-align: center; }

/* ── Data rows ── */
.mob-el-row {
  padding: 7px 4px;
  border-bottom: 1px solid #0d1220;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.12s;
}
.mob-el-row:active { background: #0d1220; }

.mob-el-sym {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.35rem;
  line-height: 1;
  /* col 1: 40px */
}
.mob-el-name {
  font-size: 0.82rem;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* col 2: 1fr */
}
.mob-el-disc {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  color: var(--muted);
  text-align: right;
  /* col 3: 58px */
}
.mob-el-mass {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  color: #2a3550;
  text-align: right;
  /* col 4: 58px */
}
.mob-el-phase {
  display: flex;
  align-items: center;
  justify-content: center;
  /* col 5: 44px */
}
.mob-el-phase-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  transition: background 0.3s;
  display: block;
}

/* Mobile filter dimming */
.mob-cat-section.dimmed { opacity: 0.15; pointer-events: none; }
.mob-el-row.dimmed { opacity: 0.15; pointer-events: none; }
.mob-el-row.highlighted { background: #0d1525; }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="header-left">
    <h1>Periodic Table</h1>
    <p>118 Elements · Interactive</p>
  </div>
  <div class="header-phase">

      <div class="pl-item"><div class="pl-dot" style="background:var(--c-liquid)"></div>Liquid</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--c-gas)"></div>Gas</div>
      <div class="pl-item"><div class="pl-dot" style="background:#3a4560"></div>Unknown</div>
    </div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Name, symbol or Z…">
  <button class="filter-btn clear-btn" id="clear-btn">✕ Clear</button>
  <div class="sep"></div>
  <div class="controls-filters">
  <button class="filter-btn" data-cat="Alkali Metal"     style="--col:var(--c-alkali)">Alkali</button>
  <button class="filter-btn" data-cat="Alkaline Earth"   style="--col:var(--c-alkaline)">Alkaline Earth</button>
  <button class="filter-btn" data-cat="Transition Metal" style="--col:var(--c-transition)">Transition</button>
  <button class="filter-btn" data-cat="Post-Transition"  style="--col:var(--c-post)">Post-Trans.</button>
  <button class="filter-btn" data-cat="Metalloid"        style="--col:var(--c-metalloid)">Metalloid</button>
  <button class="filter-btn" data-cat="Nonmetal"         style="--col:var(--c-nonmetal)">Nonmetal</button>
  <button class="filter-btn" data-cat="Noble Gas"        style="--col:var(--c-noble)">Noble Gas</button>
  <button class="filter-btn" data-cat="Lanthanide"       style="--col:var(--c-lanthanide)">Lanthanide</button>
  <button class="filter-btn" data-cat="Actinide"         style="--col:var(--c-actinide)">Actinide</button>
  </div>
</div>



<div class="table-wrap">
  <div class="pt-grid" id="grid"></div>
</div>

<!-- Mobile element list (hidden on desktop, shown on <768px) -->
<div class="mobile-list" id="mobileList"></div>


</div><!-- /.page -->

<!-- Detail Panel -->
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-head-top">
      <div class="panel-head-sym">
        <div class="p-sym" id="pSym"></div>
      </div>
      <div class="panel-head-text">

      </div>
    </div>
    <div class="p-badges" id="pBadges"></div>
    <div class="panel-atom">

  </div>
  <div class="panel-body" id="pBody"></div>
</div>

function hexToRgbArr(h) {
  h = CAT_HEX[h] || h;
  const c = h.replace('#','');
  return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
}

function drawNucleusCanvas(ctx, cx, cy, z) {
  const n = ATOM_NEUTRONS[z] ?? Math.round(z*1.2);
  const total = z + n;

  // Particle size shrinks every 10 particles — floor at 1.6, always >> electrons
  // Fixed at 3.2 for Z<=48 (total<=112), shrinks for heavier elements, floors at 2.2 from Z=72
  const pr = total <= 112 ? 3.2 :
             total <= 130 ? 2.7 :
             total <= 160 ? 2.4 :
             2.2;
  const gap = pr * 2.3;

  // Enough shells for 240+ particles (heaviest elements)
  const shellCfg = [
    {cap:1,   r:0},
    {cap:6,   r:gap},
    {cap:12,  r:gap*1.85},
    {cap:20,  r:gap*2.65},
    {cap:26,  r:gap*3.35},
    {cap:32,  r:gap*4.0},
    {cap:38,  r:gap*4.6},
    {cap:44,  r:gap*5.2},
    {cap:50,  r:gap*5.75},
    {cap:56,  r:gap*6.25},
    {cap:62,  r:gap*6.75},
    {cap:68,  r:gap*7.2},
  ];

  // Build full particle list — interleave protons and neutrons
  const particles = [];
  for(let i=0;i<total;i++) particles.push({isP: i%2===0 ? i/2 < z : (i-1)/2 < n});

  // Better interleave: alternate p/n
  const pList = Array.from({length:z}, (_,i)=>({isP:true,  idx:i}));
  const nList = Array.from({length:n}, (_,i)=>({isP:false, idx:i}));
  const ordered = [];
  const ml = Math.max(pList.length, nList.length);
  for(let i=0;i<ml;i++){
    if(i<pList.length)  ordered.push(pList[i]);
    if(i<nList.length)  ordered.push(nList[i]);
  }

  // Assign 3D positions in spherical shells
  const placed3d = [];
  let placed = 0;
  for(const shell of shellCfg){
    if(placed >= ordered.length) break;
    const inShell = Math.min(shell.cap, ordered.length - placed);
    for(let i=0; i<inShell; i++){
      let x3,y3,z3;
      if(shell.r === 0){
        x3=0; y3=0; z3=0;
      } else {
        // Distribute evenly on sphere surface using golden angle
        const phi = Math.acos(1 - 2*(i+0.5)/inShell);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        x3 = shell.r * Math.sin(phi) * Math.cos(theta);
        y3 = shell.r * Math.sin(phi) * Math.sin(theta);
        z3 = shell.r * Math.cos(phi);
      }
      placed3d.push({...ordered[placed], x3, y3, z3});
      placed++;
    }
  }

  // Sort back-to-front by z3
  placed3d.sort((a,b) => a.z3 - b.z3);

  // Nucleus glow halo
  // glowR based on outermost occupied shell radius
  const outerR = shellCfg[Math.min(shellCfg.findIndex((_,i,a)=>a.slice(0,i+1).reduce((s,c)=>s+c.cap,0)>=total||i===a.length-1), shellCfg.length-1)].r;
  const glowR = outerR + pr * 2.5;
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
  grd.addColorStop(0,'rgba(248,113,113,0.18)');
  grd.addColorStop(1,'rgba(248,113,113,0)');
  ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2);
  ctx.fillStyle=grd; ctx.fill();

  // Draw particles depth-sorted — back ones smaller/dimmer, front ones larger/brighter
  const maxZ = gap * (shellCfg.length - 1);
  placed3d.forEach(({x3, y3, z3, isP}) => {
    const t = (z3 + maxZ) / (2 * maxZ); // 0=back, 1=front
    const r = pr * (0.65 + 0.5 * t);    // shrinks at back, grows at front
    const brightness = 0.4 + 0.6 * t;   // dims at back

    const sx = cx + x3;
    const sy = cy + y3;

    // Colours scaled by depth
    const pFront='#f87171', pBack='#7f2d2d';
    const nFront='#94a3b8', nBack='#374151';
    const col = isP ? (t>0.5?'#f87171':'#c45c5c') : (t>0.5?'#94a3b8':'#4b5563');
    const lit = isP ? '#fca5a5' : '#cbd5e1';

    const g = ctx.createRadialGradient(sx-r*0.3, sy-r*0.3, 0, sx, sy, r);
    g.addColorStop(0, `rgba(${isP?'252,165,165':'203,213,225'},${(brightness*0.9).toFixed(2)})`);
    g.addColorStop(1, col);
    ctx.globalAlpha = 0.55 + 0.45 * t;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Label below
  const labelY = cy + glowR + 14;
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6b7a99';
  ctx.fillText(`${z}p  ${n}n  ${z}e\u207B`, cx, labelY);
}

function startAtomCanvas(z, elColorRaw) {
  if(atomAnimId){cancelAnimationFrame(atomAnimId);atomAnimId=null;}
  const canvas=document.getElementById('atomCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const hexColor = CAT_HEX[elColorRaw] || elColorRaw;
  const shells=SHELLS[z]||[];
  const ns=shells.length;
  const [er,eg,eb]=hexToRgbArr('#60a5fa');
  const [cr,cg,cb]=hexToRgbArr(hexColor);

  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.offsetWidth||280;
  const H=220;
  canvas.setAttribute('height', H);
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.scale(dpr,dpr);

  const cx=W/2,cy=H/2;
  const minR=ns===1?72:32;
  const maxR=Math.min(cx,cy)-6;
  const step=ns>1?(maxR-minR)/(ns-1):0;

  const totalE=shells.reduce((a,b)=>a+b,0);
  const eBase=totalE<=2?2.8:totalE<=10?2.2:totalE<=36?1.8:totalE<=54?1.5:1.2;

  const electronData=[];
  shells.forEach((count,si)=>{
    const r=minR+si*step;
    for(let e=0;e<count;e++){
      const seed=si*97+e*31;
      const rand=(o)=>{const x=Math.sin(seed+o)*43758.5453;return x-Math.floor(x);};
      electronData.push({r,tilt:0.1+rand(1)*0.85,planeAngle:rand(2)*Math.PI*2,
        speed:(0.25+rand(3)*1.4)*(rand(4)>0.5?1:-1),offset:rand(5)*Math.PI*2});
    }
  });

  const shellRadii=shells.map((_,i)=>minR+i*step);
  let lastTime=null;

  function draw(ts){
    if(!lastTime)lastTime=ts;
    const dt=Math.min((ts-lastTime)/1000,0.05);
    lastTime=ts;
    ctx.clearRect(0,0,W,H);
    electronData.forEach(e=>{e.offset+=e.speed*dt;});

    shellRadii.forEach(r=>{
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${cr},${cg},${cb},0.08)`;ctx.lineWidth=0.6;ctx.stroke();
    });

    const allE=electronData.map(ed=>{
      const x3=ed.r*Math.cos(ed.offset);
      const y3=ed.r*Math.sin(ed.offset)*ed.tilt;
      const xr=x3*Math.cos(ed.planeAngle)-y3*Math.sin(ed.planeAngle);
      const yr=x3*Math.sin(ed.planeAngle)+y3*Math.cos(ed.planeAngle);
      const z3=ed.r*Math.sin(ed.offset);
      return{sx:cx+xr,sy:cy+yr,z3};
    });
    allE.sort((a,b)=>a.z3-b.z3);

    // Back electrons
    allE.filter(e=>e.z3<0).forEach(({sx,sy,z3})=>{
      const t=Math.abs(z3)/(shellRadii[shellRadii.length-1]||1);
      const r=Math.max(eBase*(1-t*0.55),0.4);
      ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${er},${eg},${eb},${(0.12+(1-t)*0.35).toFixed(2)})`;ctx.fill();
    });

    drawNucleusCanvas(ctx,cx,cy,z);

    // Front electrons
    allE.filter(e=>e.z3>=0).forEach(({sx,sy,z3})=>{
      const t=z3/(shellRadii[shellRadii.length-1]||1);
      const r=eBase*(0.7+t*0.45);
      const op=0.6+t*0.4;
      const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,r*2.0);
      grd.addColorStop(0,`rgba(${er},${eg},${eb},${(op*0.35).toFixed(2)})`);
      grd.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
      ctx.beginPath();ctx.arc(sx,sy,r*2.0,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      const g2=ctx.createRadialGradient(sx-r*0.3,sy-r*0.3,0,sx,sy,r);
      g2.addColorStop(0,`rgba(255,255,255,${(op*0.6).toFixed(2)})`);
      g2.addColorStop(0.4,`rgba(${er},${eg},${eb},${op.toFixed(2)})`);
      g2.addColorStop(1,`rgba(${er},${eg},${eb},${(op*0.7).toFixed(2)})`);
      ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
    });

    atomAnimId=requestAnimationFrame(draw);
  }
  atomAnimId=requestAnimationFrame(draw);
}

const CAT = {
  'Alkali Metal':      'var(--c-alkali)',
  'Alkaline Earth':    'var(--c-alkaline)',
  'Transition Metal':  'var(--c-transition)',
  'Post-Transition':   'var(--c-post)',
  'Metalloid':         'var(--c-metalloid)',
  'Nonmetal':          'var(--c-nonmetal)',
  'Noble Gas':         'var(--c-noble)',
  'Lanthanide':        'var(--c-lanthanide)',
  'Actinide':          'var(--c-actinide)',
  'Unknown':           'var(--c-unknown)',
};

const PHASE_COLORS = {
  solid:   'var(--c-solid)',
  liquid:  'var(--c-liquid)',
  gas:     'var(--c-gas)',
  unknown: 'var(--c-unknown-phase)',
};

let activeFilter = '';
let currentTemp = 25;
let phaseMode = false; // when slider was touched, show phase colours

// ─── PHASE ─────────────────────────────────────────────────────────────────
function getPhase(el, t) {
  if (el.melt === null || el.boil === null) return 'unknown';
  if (t < el.melt) return 'solid';
  if (t < el.boil) return 'liquid';
  return 'gas';
}

// ─── GRID BUILD ─────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');

// Row 8 = gap spacer spanning all 18 columns
const gap = document.createElement('div');
gap.style.cssText = 'grid-column:1/span 18;grid-row:8;height:2px;';
grid.appendChild(gap);

// f-block row labels (col 3, rows 9 and 10)
function fLabel(r, txt) {
  const d = document.createElement('div');
  d.className = 'f-label';
  d.style.cssText = `grid-column:3;grid-row:${r};font-size:0.5rem;`;
  d.textContent = txt;
  grid.appendChild(d);
}

// Main table placeholder for La/Ac blocks (row 6/7 col 3)
function phBox(c, r, txt, clr) {
  const d = document.createElement('div');
  d.className = 'f-label';
  d.style.cssText = `grid-column:${c};grid-row:${r};border-color:${clr};color:${clr};font-size:0.5rem;`;
  d.textContent = txt;
  grid.appendChild(d);
  return d;
}
function fLabel2(r, txt) {
  const d = document.createElement('div');
  d.className = 'f-label';
  d.style.cssText = `grid-column:3;grid-row:${r};font-size:0.5rem;`;
  d.textContent = txt;
  grid.appendChild(d);
  return d;
}
const phLa = phBox(3, 6, '57→', 'var(--c-lanthanide)');
const phAc = phBox(3, 7, '89→', 'var(--c-actinide)');
const phLaLabel = fLabel2(9, '57–71');
const phAcLabel = fLabel2(10,'89–103');

// Build element cells
const elDivs = {}; // z → div
E.forEach(el => {
  const d = document.createElement('div');
  d.className = 'el';
  d.style.cssText = `grid-column:${el.col};grid-row:${el.row};`;
  d.innerHTML = `
    <div class="top-bar"></div>
    <span class="z">${el.z}</span>
    <span class="sym">${el.s}</span>
    <span class="el-name">${el.n}</span>
    <span class="el-mass">${el.m}</span>
  `;
  d.addEventListener('click', () => openPanel(el));
  grid.appendChild(d);
  elDivs[el.z] = d;
});

// ─── COLOUR CELLS ───────────────────────────────────────────────────────────
function updateCellColors() {
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    const topBar = d.querySelector('.top-bar');
    const symEl  = d.querySelector('.sym');

    if (phaseMode) {
      const phase = getPhase(el, currentTemp);
      const c = PHASE_COLORS[phase];
      d.style.setProperty('--el-color', c);
      d.style.setProperty('--phase-bg', c);
      topBar.style.background = c;
      symEl.style.color = c;
    } else {
      const c = CAT[el.cat] || 'var(--c-unknown)';
      d.style.setProperty('--el-color', c);
      d.style.setProperty('--phase-bg', 'transparent');
      topBar.style.background = c;
      symEl.style.color = c;
    }
  });
}

updateCellColors();

// ─── TEMP SLIDER ────────────────────────────────────────────────────────────
const slider = document.getElementById('tempSlider');
const tempValEl = document.getElementById('tempVal');

slider.addEventListener('input', function() {
  currentTemp = parseInt(this.value);
  phaseMode = true;
  tempValEl.textContent = currentTemp + ' °C';
  updateCellColors();
  // If panel open, refresh phase pill
  if (document.getElementById('panel').classList.contains('open') && openedEl) {
    refreshPhasePill(openedEl);
  }
});

// ─── FILTER ─────────────────────────────────────────────────────────────────
function applyFilter(cat) {
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    if (!cat) {
      d.classList.remove('dimmed','highlighted');
    } else if (el.cat === cat) {
      d.classList.remove('dimmed'); d.classList.add('highlighted');
    } else {
      d.classList.add('dimmed'); d.classList.remove('highlighted');
    }
  });
  // Dim/restore the f-block placeholder boxes in the main table
  const lantMatch = !cat || cat === 'Lanthanide';
  const actMatch  = !cat || cat === 'Actinide';
  [phLa, phLaLabel].forEach(d => { if(d) d.style.opacity = lantMatch ? '1' : '0.12'; });
  [phAc, phAcLabel].forEach(d => { if(d) d.style.opacity = actMatch  ? '1' : '0.12'; });
  // Mobile list
  if (typeof applyMobileFilter === 'function') applyMobileFilter(cat);
}

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    if (activeFilter === cat) {
      activeFilter = '';
      btn.classList.remove('active');
    } else {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    applyFilter(activeFilter);
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  activeFilter = '';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  applyFilter('');
  document.getElementById('search').value = '';
  applyFilter('');
});

// ─── SEARCH ─────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { applyFilter(activeFilter); return; }
  E.forEach(el => {
    const d = elDivs[el.z];
    if (!d) return;
    const match = el.n.toLowerCase().includes(q) || el.s.toLowerCase() === q || String(el.z) === q;
    if (match) { d.classList.remove('dimmed'); d.classList.add('highlighted'); }
    else        { d.classList.add('dimmed'); d.classList.remove('highlighted'); }
  });
});

// ─── DETAIL PANEL ───────────────────────────────────────────────────────────
let openedEl = null;

function refreshPhasePill(el) {
  const phase = getPhase(el, currentTemp);
  const labels = {solid:'Solid',liquid:'Liquid',gas:'Gas',unknown:'Unknown'};
  const pill = document.getElementById('phasePill');
  if (pill) {
    pill.className = `phase-pill ${phase === 'unknown' ? 'unknown-phase' : phase}`;
    pill.textContent = labels[phase] + ' at ' + currentTemp + '°C';
  }
}

function openPanel(el) {
  openedEl = el;
  const color = CAT[el.cat] || 'var(--c-unknown)';

  document.getElementById('pSym').textContent = el.s;
  document.getElementById('pSym').style.color = color;
  document.getElementById('pName').textContent = el.n;
  document.getElementById('pMeta').textContent = `Z = ${el.z}  ·  Period ${el.row <= 7 ? el.row : (el.row === 9 ? 6 : 7)}`;
  document.getElementById('pBadges').innerHTML = `
    <span class="badge" style="background:color-mix(in srgb,${color} 15%,transparent);color:${color};border:1px solid color-mix(in srgb,${color} 30%,transparent)">${el.cat}</span>
    <span class="phase-pill ${(() => { const p = getPhase(el,currentTemp); return p==='unknown'?'unknown-phase':p; })()} " id="phasePill">${(() => { const p=getPhase(el,currentTemp); return {solid:'Solid',liquid:'Liquid',gas:'Gas',unknown:'Unknown'}[p]+' at '+currentTemp+'°C'; })()}</span>
  `;

  const fmt = v => v != null ? v : '—';

  document.getElementById('pBody').innerHTML = `
    <div class="p-section">Physical Properties</div>
    <div class="p-row"><span class="lbl">Atomic Mass</span><span class="val">${el.m} u</span></div>
    <div class="p-row"><span class="lbl">Density</span><span class="val">${fmt(el.den)} g/cm³</span></div>
    <div class="p-row"><span class="lbl">Melting Point</span><span class="val">${fmt(el.melt)} °C</span></div>
    <div class="p-row"><span class="lbl">Boiling Point</span><span class="val">${fmt(el.boil)} °C</span></div>
    <div class="p-section">Identity</div>
    <div class="p-row"><span class="lbl">Atomic Number</span><span class="val">${el.z}</span></div>
    <div class="p-row"><span class="lbl">Symbol</span><span class="val">${el.s}</span></div>
    <div class="p-row"><span class="lbl">Category</span><span class="val">${el.cat}</span></div>
    <div class="p-row"><span class="lbl">Discovered</span><span class="val">${el.disc}</span></div>
    <div class="p-section">Electron Configuration</div>
    <div class="config-box">${el.cfg}</div>
  `;

  document.getElementById('panel').classList.add('open');
  setTimeout(() => startAtomCanvas(el.z, color), 30);
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  if(atomAnimId){cancelAnimationFrame(atomAnimId);atomAnimId=null;}
  openedEl = null;
});

// legend removed

// ─── AUTO-SCALE FOR IPAD / NARROW BROWSERS ──────────────────────────────────
function autoScale() {
  // Skip on true mobile — CSS @media handles layout there
  if (window.innerWidth < 768) return;
  const page = document.querySelector('.page');
  if (!page) return;
  const vw = window.innerWidth;
  const pageW = 1043;
  if (vw < pageW) {
    const scale = vw / pageW;
    page.style.transform = `scale(${scale})`;
    page.style.marginBottom = `-${Math.round(pageW * (1 - scale))}px`;
    document.body.style.overflowX = 'hidden';
  } else {
    page.style.transform = '';
    page.style.marginBottom = '';
    document.body.style.overflowX = 'auto';
  }
}
autoScale();
window.addEventListener('resize', autoScale);

// ─── MOBILE LIST BUILDER ─────────────────────────────────────────────────────
(function buildMobileList() {
  const container = document.getElementById('mobileList');
  if (!container) return;

  // Category display order + colours (hex direct — no CSS vars in JS)
  const CAT_ORDER = [
    { cat:'Alkali Metal',      hex:'#ff4d6d', label:'Alkali Metals' },
    { cat:'Alkaline Earth',    hex:'#ff8c42', label:'Alkaline Earth Metals' },
    { cat:'Transition Metal',  hex:'#4facfe', label:'Transition Metals' },
    { cat:'Post-Transition',   hex:'#a78bfa', label:'Post-Transition Metals' },
    { cat:'Metalloid',         hex:'#34d399', label:'Metalloids' },
    { cat:'Nonmetal',          hex:'#fbbf24', label:'Nonmetals' },
    { cat:'Noble Gas',         hex:'#f472b6', label:'Noble Gases' },
    { cat:'Lanthanide',        hex:'#60a5fa', label:'Lanthanides' },
    { cat:'Actinide',          hex:'#f87171', label:'Actinides' },
    { cat:'Unknown',           hex:'#6b7280', label:'Unknown Properties' },
  ];

  const PHASE_PHASE_HEX = { solid:'#4facfe', liquid:'#34d399', gas:'#c084fc', unknown:'#3a4560' };

  // Build sections
  CAT_ORDER.forEach(({ cat, hex, label }) => {
    const els = E.filter(e => e.cat === cat);
    if (!els.length) return;

    const section = document.createElement('div');
    section.className = 'mob-cat-section';
    section.dataset.cat = cat;

    section.innerHTML = `
      <div class="mob-cat-heading">
        <div class="mob-cat-dot-title">
          <div class="mob-cat-dot" style="background:${hex}"></div>
          <span class="mob-cat-title">${label}</span>
        </div>
        <span class="mob-col-h">Discovered</span>
        <span class="mob-col-h">Mass</span>
        <span class="mob-col-h mob-col-h-phase">Phase</span>
      </div>
    `;

    els.forEach(el => {
      const row = document.createElement('div');
      row.className = 'mob-el-row';
      row.dataset.z = el.z;
      const phase = getPhase(el, currentTemp);
      const phaseHex = PHASE_PHASE_HEX[phase];
      row.innerHTML = `
        <span class="mob-el-sym" style="color:${hex}">${el.s}</span>
        <span class="mob-el-name">${el.n}</span>
        <span class="mob-el-disc">${el.disc ?? '—'}</span>
        <span class="mob-el-mass">${el.m}</span>
        <div class="mob-el-phase"><span class="mob-el-phase-dot" style="background:${phaseHex}" data-z="${el.z}"></span></div>
      `;
      row.addEventListener('click', () => openPanel(el));
      section.appendChild(row);
    });

    container.appendChild(section);
  });

  // Update phase dots when slider moves
  window.updateMobilePhase = function() {
    const PHASE_HEX = { solid:'#4facfe', liquid:'#34d399', gas:'#c084fc', unknown:'#3a4560' };
    document.querySelectorAll('.mob-el-phase-dot').forEach(dot => {
      const z = parseInt(dot.dataset.z, 10);
      const el = E.find(e => e.z === z);
      if (!el) return;
      const phase = getPhase(el, currentTemp);
      dot.style.background = PHASE_HEX[phase];
    });
  };

  // Filter mobile list to match desktop filter
  window.applyMobileFilter = function(cat) {
    document.querySelectorAll('.mob-cat-section').forEach(sec => {
      if (!cat) {
        sec.classList.remove('dimmed');
        sec.querySelectorAll('.mob-el-row').forEach(r => r.classList.remove('dimmed','highlighted'));
      } else if (sec.dataset.cat === cat) {
        sec.classList.remove('dimmed');
        sec.querySelectorAll('.mob-el-row').forEach(r => { r.classList.remove('dimmed'); r.classList.add('highlighted'); });
      } else {
        sec.classList.add('dimmed');
        sec.querySelectorAll('.mob-el-row').forEach(r => r.classList.remove('highlighted'));
      }
    });
  };

  // Search mobile list
  window.applyMobileSearch = function(q) {
    document.querySelectorAll('.mob-el-row').forEach(row => {
      const z = parseInt(row.dataset.z, 10);
      const el = E.find(e => e.z === z);
      if (!el) return;
      if (!q) { row.classList.remove('dimmed','highlighted'); return; }
      const match = el.n.toLowerCase().includes(q) || el.s.toLowerCase() === q || String(el.z) === q;
      if (match) { row.classList.remove('dimmed'); row.classList.add('highlighted'); }
      else        { row.classList.add('dimmed'); row.classList.remove('highlighted'); }
    });
    // Show/hide sections based on whether any rows are visible
    document.querySelectorAll('.mob-cat-section').forEach(sec => {
      const hasVisible = [...sec.querySelectorAll('.mob-el-row')].some(r => !r.classList.contains('dimmed'));
      sec.style.display = q && !hasVisible ? 'none' : '';
    });
  };
})();

// Hook mobile phase updates into the existing slider listener
slider.addEventListener('input', function() {
  if (typeof updateMobilePhase === 'function') updateMobilePhase();
});

// Hook mobile filter + search into the existing clear button
// (filter buttons and search already call applyFilter / applyMobileSearch
//  via the patched originals below — clear needs explicit mobile call)
document.getElementById('clear-btn').addEventListener('click', () => {
  if (typeof applyMobileFilter  === 'function') applyMobileFilter('');
  if (typeof applyMobileSearch  === 'function') applyMobileSearch('');
});

// Hook mobile search into the existing search input
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (typeof applyMobileSearch === 'function') applyMobileSearch(q);
});


</script>
